<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard – Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-white/10 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-emerald-500">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <path d="M10 14h4v4h-4z"></path>
        </svg>
        <div>
          <h1 class="font-display font-bold text-lg leading-none">Adventskalender</h1>
          <p class="text-xs text-slate-400">Angemeldet als <span id="admin-name" class="font-medium text-emerald-400"></span></p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button id="upgrade-btn" class="hidden rounded-full bg-gradient-to-r from-amber-500 to-orange-500 text-white text-sm font-bold px-4 py-1.5 hover:scale-105 transition-transform shadow-lg shadow-orange-500/20">
          ⭐ Auf PRO upgraden
        </button>
        <span id="pro-badge" class="hidden rounded-full bg-amber-500/20 text-amber-400 text-xs font-bold px-3 py-1 border border-amber-500/30">PRO USER</span>
        <button id="logout-btn" class="text-sm font-medium text-slate-400 hover:text-white transition-colors">Abmelden</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-10">
    <section class="bg-white/5 border border-white/10 rounded-2xl p-6">
      <h2 class="font-display text-xl font-semibold mb-4">Neuen Kalender erstellen</h2>
      <form id="create-form" class="grid sm:grid-cols-4 gap-4 items-end">
        <div class="sm:col-span-2">
          <label class="block text-sm text-slate-300 mb-1">Name des Beschenkten</label>
          <input name="recipientName" required placeholder="z. B. Bine"
            class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Jahr</label>
          <input name="year" type="number" required value="2026" min="2000" max="2200"
            class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Theme</label>
          <select name="theme" required
            class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="partner">Partner*in – Romantisch</option>
            <option value="kid">Kind – Verspielt &amp; bunt</option>
            <option value="parents">Eltern – Klassisch &amp; elegant</option>
            <option value="modern">Modern – Minimalistisch</option>
            <option value="firma">Firma – Corporate Design</option>
          </select>
        </div>
        <div class="sm:col-span-4 mt-2">
          <label class="block text-sm text-slate-300 mb-1">E-Mail für tägliche Erinnerungen (Optional)</label>
          <input name="recipientEmail" type="email" placeholder="z. B. bine@beispiel.de"
            class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div class="sm:col-span-4">
          <label class="block text-sm text-slate-300 mb-1">Vorlage (Optional)</label>
            <select name="template" class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">-- Keine (leer starten) --</option>
              <option value="romantic">Romantisch (Texte für Partner)</option>
              <option value="mindful">Achtsamkeit (24 versch. Aufgaben)</option>
              <option value="jokes">Witze & Humor</option>
              <option value="quotes">Inspirierende Zitate</option>
              <option value="fitness">Fitness-Challenges</option>
              <option value="trivia">Quiz & Unnützes Wissen</option>
              <option value="recipes">Back- & Kochrezepte</option>
              <option value="couples_activities">Pärchen-Aktivitäten</option>
              <option value="kids_fun">Für Kinder: Rätsel & Spaß</option>
              <option value="praise">Komplimente & Affirmationen</option>
              <option value="photo_memories">Fotokalender (Platzhalter für Bilder)</option>
              <option value="escape_room">Escape Room (Tägliche Rätsel)</option>
            </select>
        </div>
        <div class="sm:col-span-4 flex items-center gap-2 mt-2">
          <input type="checkbox" id="strictMode" name="strictMode" checked class="w-4 h-4 text-emerald-600 rounded bg-slate-900 border-white/10 focus:ring-emerald-500 focus:ring-2">
          <label for="strictMode" class="text-sm text-slate-300">Strict Mode <span class="text-slate-500">(Türchen lassen sich erst am jeweiligen Dezember-Tag öffnen)</span></label>
        </div>
        <div class="sm:col-span-4 flex items-center gap-2 mt-1">
          <input type="checkbox" id="randomLayout" name="randomLayout" class="w-4 h-4 text-emerald-600 rounded bg-slate-900 border-white/10 focus:ring-emerald-500 focus:ring-2">
          <label for="randomLayout" class="text-sm text-slate-300">Zahlen mischen <span class="text-slate-500">(Die Türchen werden im Raster durcheinander angeordnet)</span></label>
        </div>
        <div class="sm:col-span-4 mt-2">
          <button type="submit"
            class="rounded-lg bg-emerald-600 hover:bg-emerald-500 transition-colors text-white font-semibold px-5 py-2.5">
            + Kalender anlegen
          </button>
        </div>
      </form>
    </section>

    <section>
      <h2 class="font-display text-xl font-semibold mb-4">Deine Kalender</h2>
      <div id="calendar-list" class="grid sm:grid-cols-2 gap-4"></div>
      <p id="empty-state" class="hidden text-slate-500 text-sm">Noch kein Kalender erstellt – leg oben deinen ersten an.</p>
    </section>
  </main>

  <!-- Analytics Modal -->
  <div id="analytics-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative">
      <button onclick="document.getElementById('analytics-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl">✕</button>
      <h3 class="font-display text-xl font-semibold mb-4">Statistiken</h3>
      <div class="bg-slate-800 rounded-lg p-4 mb-4">
        <canvas id="analyticsChart" width="400" height="200"></canvas>
      </div>
    </div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>

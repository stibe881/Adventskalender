<!doctype html>
<html lang="de">
<head>  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <!-- share-meta -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta property="og:title" content="Dashboard – Advently">
  <meta property="og:site_name" content="Advently">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://mein-adventskalender.ch/icons/icon-512x512.png">
  <meta name="twitter:card" content="summary">
  <!-- /share-meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dashboard – Advently</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <link rel="stylesheet" href="/shared/theme.css" />
  <link rel="stylesheet" href="/shared/ui.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="/shared/icons.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 overflow-x-hidden">
  <header class="border-b border-white/10 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-3 sm:px-4 py-3 sm:py-4 flex flex-wrap items-center justify-between gap-x-4 gap-y-2">
      <div class="flex items-center gap-3 min-w-0">
        <img src="/admin/images/logo.png" alt="Logo" class="w-10 h-10 sm:w-12 sm:h-12 rounded-lg object-cover shadow-lg shadow-emerald-500/20 shrink-0" />
        <div>
          <h1 class="font-display font-bold text-lg leading-none">Advently</h1>
          <p class="text-xs text-slate-400 truncate max-w-[55vw] sm:max-w-none">Angemeldet als <span id="admin-name" class="font-medium text-emerald-400"></span></p>
        </div>
      </div>
      <div class="flex items-center gap-2 sm:gap-4 flex-wrap">
        <nav class="app-switch flex bg-slate-800 rounded-lg p-1 border border-white/10 text-xs font-semibold whitespace-nowrap" aria-label="Bereich wechseln">
          <a href="/admin/dashboard.html" class="px-2.5 sm:px-3 py-1.5 rounded-md bg-emerald-600 text-white shadow"><i data-icon="tree-pine"></i> Adventskalender</a>
          <a href="/admin/wichteln.html" class="px-2.5 sm:px-3 py-1.5 rounded-md text-slate-400 hover:text-white"><i data-icon="gift"></i> Wichteln</a>
          <a href="/admin/wichteltuer.html" class="px-2.5 sm:px-3 py-1.5 rounded-md text-slate-400 hover:text-white"><i data-icon="door-open"></i> Wichteltür</a>
        </nav>
        <button id="admin-toggle-pro" class="hidden text-xs font-bold bg-purple-600 hover:bg-purple-500 text-white px-2 py-1 rounded whitespace-nowrap">Dev: PRO</button>
        <a href="/admin/account.html" class="text-sm font-medium text-slate-400 hover:text-white transition-colors whitespace-nowrap">Konto</a>
        <button id="logout-btn" class="text-sm font-medium text-slate-400 hover:text-white transition-colors whitespace-nowrap">Abmelden</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-10">
    <section>
      <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
        <h2 class="font-display text-2xl font-semibold">Deine Kalender</h2>
        <div class="flex items-center gap-3 flex-wrap">
          <div class="bg-slate-800 rounded-lg p-1 flex gap-1 border border-white/10">
            <button id="view-grid-btn" class="p-1.5 rounded-md bg-emerald-600 text-white shadow" title="Kachel-Ansicht">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            </button>
            <button id="view-table-btn" class="p-1.5 rounded-md hover:bg-slate-700 text-slate-400" title="Listen-Ansicht">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"></line><line x1="8" y1="12" x2="21" y2="12"></line><line x1="8" y1="18" x2="21" y2="18"></line><line x1="3" y1="6" x2="3.01" y2="6"></line><line x1="3" y1="12" x2="3.01" y2="12"></line><line x1="3" y1="18" x2="3.01" y2="18"></line></svg>
            </button>
          </div>
          <button onclick="document.getElementById('create-modal').classList.remove('hidden')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg font-semibold transition-colors text-sm">
            + Neuer Kalender
          </button>
        </div>
      </div>
      
      <div id="calendar-list" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
      <div id="calendar-table-container" class="hidden bg-white/5 border border-white/10 rounded-xl">
        <table class="w-full text-left text-sm text-slate-300" style="table-layout:auto">
          <thead class="bg-slate-800/50 text-slate-400 uppercase text-xs border-b border-white/10">
            <tr>
              <th class="px-2 sm:px-4 py-3" style="width:100%">Empfänger</th>
              <th class="px-4 py-3 hidden md:table-cell">Theme</th>
              <th class="px-2 sm:px-4 py-3">Befüllt</th>
              <th class="px-2 sm:px-4 py-3">Geöffnet</th>
              <th class="px-1 sm:px-4 py-3 text-right"><span class="hidden sm:inline">Aktionen</span></th>
            </tr>
          </thead>
          <tbody id="calendar-table-body" class="divide-y divide-white/10"></tbody>
        </table>
      </div>
      <div id="empty-state" class="hidden text-center py-12 bg-white/5 border border-white/10 rounded-2xl mt-4">
        <div class="text-4xl mb-3 text-emerald-400"><i data-icon="gift"></i></div>
        <h3 class="text-lg font-semibold text-white mb-1">Noch keine Kalender</h3>
        <p class="text-slate-400 text-sm mb-4">Erstelle deinen ersten Adventskalender, um loszulegen.</p>
        <button onclick="document.getElementById('create-modal').classList.remove('hidden')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg font-semibold transition-colors">
          Jetzt erstellen
        </button>
      </div>
    </section>
  </main>

  <!-- Create Modal -->
  <div id="create-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative">
      <button onclick="document.getElementById('create-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i data-icon="x"></i></button>
      <h2 class="font-display text-xl font-semibold mb-6">Neuen Kalender erstellen</h2>
      <form id="create-form" class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
        <div class="sm:col-span-2">
          <label class="block text-sm text-slate-300 mb-1">Name des Beschenkten</label>
          <input name="recipientName" required placeholder="z. B. Bine"
            class="w-full rounded-lg bg-slate-800 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Jahr</label>
          <input name="year" type="number" required value="2026" min="2000" max="2200"
            class="w-full rounded-lg bg-slate-800 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Theme</label>
          <select name="theme" required
            class="w-full rounded-lg bg-slate-800 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="partner">Partner*in – Romantisch</option>
            <option value="kid">Kind – Verspielt &amp; bunt</option>
            <option value="parents">Eltern – Klassisch &amp; elegant</option>
            <option value="modern">Modern – Minimalistisch</option>
            <option value="firma">Firma – Corporate Design</option>
          </select>
        </div>
        <div class="sm:col-span-4">
          <label class="block text-sm text-slate-300 mb-1">Vorlage (Optional)</label>
            <select name="template" class="w-full rounded-lg bg-slate-800 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="">-- Keine (leer starten) --</option>
              <option value="kids_mix">Kinder – gemischte Inhalte (Spiele, Rätsel, Aufgaben, Gutscheine)</option>
              <option value="couple_mix">Pärchen – gemischte Inhalte (Liebesbriefe, Dates, Gutscheine, Quiz)</option>
              <option value="romantic">Romantisch (Texte für Partner)</option>
              <option value="mindful">Achtsamkeit (24 versch. Aufgaben)</option>
              <option value="jokes">Witze & Humor</option>
              <option value="quotes">Inspirierende Zitate</option>
              <option value="fitness">Fitness-Challenges</option>
              <option value="trivia">Quiz & Unnützes Wissen</option>
              <option value="recipes">Back- & Kochrezepte</option>
              <option value="couples_activities">Pärchen-Aktivitäten</option>
              <option value="kids_fun">Für Kinder: Rätsel & Spaß</option>
              <option value="praise">Komplimente & Affirmationen</option>
              <option value="photo_memories">Fotokalender (Platzhalter für Bilder)</option>
              <option value="escape_room">Escape Room (Tägliche Rätsel)</option>
            </select>
        </div>
        <div class="sm:col-span-4 flex items-center gap-2 mt-2">
          <input type="checkbox" id="strictMode" name="strictMode" checked class="w-4 h-4 text-emerald-600 rounded bg-slate-800 border-white/10 focus:ring-emerald-500 focus:ring-2">
          <label for="strictMode" class="text-sm text-slate-300">Strict Mode <span class="text-slate-500">(Türchen lassen sich erst am jeweiligen Dezember-Tag öffnen)</span></label>
        </div>
        <div class="sm:col-span-4 flex items-center gap-2 mt-1">
          <input type="checkbox" id="randomLayout" name="randomLayout" class="w-4 h-4 text-emerald-600 rounded bg-slate-800 border-white/10 focus:ring-emerald-500 focus:ring-2">
          <label for="randomLayout" class="text-sm text-slate-300">Zahlen mischen <span class="text-slate-500">(Die Türchen werden im Raster durcheinander angeordnet)</span></label>
        </div>
        <div class="sm:col-span-4 flex items-center gap-2 mt-1">
          <input type="checkbox" id="swissMode" name="swissMode" class="w-4 h-4 text-emerald-600 rounded bg-slate-800 border-white/10 focus:ring-emerald-500 focus:ring-2">
          <label for="swissMode" class="text-sm text-slate-300">Schweizer Modus <span class="text-slate-500">(Christkind statt Weihnachtsmann, Samichlaus statt Nikolaus – gilt für alle Vorlagentexte)</span></label>
        </div>
        <div class="sm:col-span-4 mt-6 border-t border-white/10 pt-4 text-right">
          <button type="submit"
            class="rounded-lg bg-emerald-600 hover:bg-emerald-500 transition-colors text-white font-semibold px-6 py-2.5">
            Kalender anlegen
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Analytics Modal -->
  <div id="analytics-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto p-6 relative">
      <button onclick="document.getElementById('analytics-modal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i data-icon="x"></i></button>
      <h3 class="font-display text-xl font-semibold mb-4">Statistiken</h3>
      <div class="bg-slate-800 rounded-lg p-4 mb-4">
        <canvas id="analyticsChart" width="400" height="200"></canvas>
      </div>
    </div>
  </div>

  <script src="/shared/ui.js"></script>
  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/dashboard.js"></script>
  <script src="/shared/native.js"></script>
</body>
</html>

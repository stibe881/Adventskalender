<!doctype html>
<html lang="de">
<head>  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Login – Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
    }
  </script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4 relative overflow-hidden">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <img src="/admin/images/logo.png" alt="Logo" class="w-16 h-16 rounded-xl object-cover shadow-lg shadow-emerald-500/20" />
      </div>
      <h1 class="font-display text-2xl font-bold text-white">Adventskalender</h1>
      <p class="text-slate-400 text-sm mt-1">Admin-Bereich für den Schenker</p>
    </div>

    <form id="login-form" class="bg-white/5 backdrop-blur border border-white/10 rounded-2xl p-6 shadow-xl space-y-4">
      <h2 id="form-title" class="text-xl font-bold text-white text-center mb-6">Anmelden</h2>
      <div>
        <label class="block text-sm text-slate-300 mb-1" for="email">E-Mail Adresse</label>
        <input id="email" name="email" type="email" autocomplete="email" required
          class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          placeholder="beispiel@domain.de" />
      </div>
      <!-- Registrierung Felder -->
      <div id="register-fields" class="hidden space-y-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1" for="username">Benutzername (optional)</label>
          <input id="username" name="username" type="text"
            class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            placeholder="Dein Name" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1" for="company">Firmenname (optional)</label>
          <input id="company" name="company" type="text"
            class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
            placeholder="Deine Firma" />
        </div>
      </div>

      <div>
        <label class="block text-sm text-slate-300 mb-1" for="password">Passwort</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
          class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          placeholder="••••••••" />
      </div>

      <!-- Passwort Bestätigung -->
      <div id="register-password-confirm" class="hidden">
        <label class="block text-sm text-slate-300 mb-1" for="password-confirm">Passwort bestätigen</label>
        <input id="password-confirm" name="password-confirm" type="password"
          class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500"
          placeholder="••••••••" />
      </div>

      <div id="remember-row">
        <div class="flex items-center gap-2">
          <input id="remember-me" name="remember" type="checkbox"
            class="w-4 h-4 text-emerald-600 rounded bg-slate-900 border-white/10 focus:ring-emerald-500 focus:ring-2" />
          <label for="remember-me" class="text-sm text-slate-300">Angemeldet bleiben</label>
        </div>
        <p class="text-xs text-slate-500 mt-1 ml-6">14 Tage lang. Ohne Häkchen endet die Sitzung, sobald du den Browser schliesst.</p>
      </div>

      <p id="error-msg" class="hidden text-sm text-rose-400 bg-rose-950/40 border border-rose-900 rounded-lg px-3 py-2"></p>

      <button type="submit" id="submit-btn"
        class="w-full rounded-lg bg-emerald-600 hover:bg-emerald-500 transition-colors text-white font-semibold py-2.5">
        Anmelden
      </button>

      <div class="text-center mt-4">
        <button type="button" id="toggle-mode-btn" class="text-sm text-emerald-400 hover:text-emerald-300">
          Noch keinen Account? Registrieren
        </button>
      </div>


    </form>

    <p class="text-center text-xs text-slate-500 mt-6">Nur für den Schenker – Beschenkte nutzen ihren persönlichen Link.</p>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/login.js"></script>
  <script src="/shared/native.js"></script>
</body>
</html>

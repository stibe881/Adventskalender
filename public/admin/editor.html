<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Türchen bearbeiten – Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <header class="border-b border-white/10 bg-slate-900/60 backdrop-blur sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <a href="/admin/dashboard.html" class="text-slate-400 hover:text-white text-sm shrink-0">← Zurück</a>
        <div class="min-w-0">
          <h1 id="cal-title" class="font-display font-bold text-lg leading-none truncate">Kalender laden…</h1>
          <p id="cal-subtitle" class="text-xs text-slate-400"></p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <a id="preview-link" href="#" target="_blank" rel="noopener" class="text-sm rounded-lg bg-slate-800 hover:bg-slate-700 px-3 py-1.5 transition-colors">👁 Vorschau</a>
        <button id="copy-link-btn" class="text-sm rounded-lg bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 transition-colors">🔗 Link kopieren</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8">
    <section class="bg-white/5 border border-white/10 rounded-2xl p-5">
      <h2 class="font-display text-lg font-semibold mb-3">Einstellungen</h2>
      <form id="settings-form" class="grid sm:grid-cols-4 gap-4 items-end">
        <div class="sm:col-span-2">
          <label class="block text-sm text-slate-300 mb-1">Name des Beschenkten</label>
          <input name="recipientName" required class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Jahr</label>
          <input name="year" type="number" min="2000" max="2200" class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1">Theme</label>
          <select name="theme" id="theme-select" class="w-full rounded-lg bg-slate-900/60 border border-white/10 px-3 py-2 text-white focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
        </div>
        <div class="sm:col-span-4 flex items-center gap-2 mt-2">
          <input type="checkbox" id="strictMode" name="strictMode" class="w-4 h-4 text-emerald-600 rounded bg-slate-900 border-white/10 focus:ring-emerald-500 focus:ring-2">
          <label for="strictMode" class="text-sm text-slate-300">Strict Mode <span class="text-slate-500">(Türchen lassen sich erst am jeweiligen Dezember-Tag öffnen)</span></label>
        </div>
        <div class="sm:col-span-4 hidden" id="firma-settings">
          <div class="grid sm:grid-cols-2 gap-4 mt-2 p-4 bg-white/5 border border-white/10 rounded-xl">
            <div>
              <label class="block text-sm text-slate-300 mb-1">Corporate Hintergrundbild (optional)</label>
              <input type="file" id="firma-bg" accept="image/*" class="text-sm text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 cursor-pointer" />
            </div>
            <div>
              <label class="block text-sm text-slate-300 mb-1">Firmenlogo (optional)</label>
              <input type="file" id="firma-logo" accept="image/*" class="text-sm text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-slate-300 hover:file:bg-slate-700 cursor-pointer" />
            </div>
          </div>
        </div>
        <div class="sm:col-span-4 mt-2">
          <button type="submit" class="rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 transition-colors">Speichern</button>
          <span id="settings-saved" class="hidden text-sm text-emerald-400 ml-2">Gespeichert ✓</span>
        </div>
      </form>
    </section>

    <section>
      <h2 class="font-display text-lg font-semibold mb-3">24 Türchen</h2>
      <div id="door-grid" class="grid grid-cols-4 sm:grid-cols-6 gap-3"></div>
    </section>
  </main>

  <!-- Editing modal -->
  <div id="modal-backdrop" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-30 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-display text-xl font-semibold">Türchen <span id="modal-day"></span></h3>
        <button id="modal-close" class="text-slate-400 hover:text-white text-xl leading-none">✕</button>
      </div>

      <label class="block text-sm text-slate-300 mb-1">Inhaltstyp</label>
      <select id="content-type-select" class="w-full rounded-lg bg-slate-800 border border-white/10 px-3 py-2 text-white mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <option value="">– leer / nicht befüllt –</option>
      </select>

      <div id="type-fields" class="space-y-3"></div>

      <div class="flex justify-end gap-2 mt-6">
        <button id="modal-cancel" class="rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium px-4 py-2 transition-colors">Abbrechen</button>
        <button id="modal-save" class="rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold px-4 py-2 transition-colors">Speichern</button>
      </div>
    </div>
  </div>

  <script src="/admin/js/api.js"></script>
  <script src="/admin/js/contentTypes.js"></script>
  <script src="/admin/js/editor.js"></script>
</body>
</html>

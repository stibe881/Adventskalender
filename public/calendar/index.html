<!doctype html>
<html lang="de">
<head>  <link rel="icon" type="image/png" href="/icons/favicon-64.png">
  <!-- share-meta -->
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta property="og:title" content="Dein Adventskalender">
  <meta property="og:site_name" content="Advently">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://mein-adventskalender.ch/icons/icon-512x512.png">
  <meta name="twitter:card" content="summary">
  <!-- /share-meta -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Dein Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared/styles.css" />
  <link rel="stylesheet" href="/calendar/themes.css" />
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <link rel="manifest" href="/manifest.json" />
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW failed', err));
    }
  </script>
  <script src="/shared/icons.js"></script>
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <canvas id="particle-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-0 transition-opacity duration-1000" aria-hidden="true"></canvas>

  <div id="controls" class="fixed top-4 right-4 z-50 flex gap-2">
    <button id="pixel-art-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white rounded-full p-2 backdrop-blur transition-colors" title="Community Leinwand">
      <i data-icon="palette"></i>
    </button>
    <button id="toggle-effects-btn" class="bg-black/40 hover:bg-black/60 text-white rounded-full p-2 backdrop-blur transition-colors" title="Effekte an/ausschalten (Batterie sparen)">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="m4.93 4.93 14.14 14.14"/><path d="M2 12h20"/><path d="m4.93 19.07 14.14-14.14"/></svg>
    </button>
  </div>

  <div id="app-root">
    <div id="preview-banner" class="hidden"><i data-icon="eye"></i> Admin-Vorschau – Zeitsperre ist deaktiviert</div>

    <header id="calendar-header" class="hero"></header>


    <main id="calendar-frame">
      <div id="garland"></div>
      <div id="door-grid" class="door-grid" role="list"></div>
    </main>

    <p id="calendar-footer" class="calendar-footer"></p>
  </div>

  <!-- Global Audio Player -->
  <div id="global-player" class="hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-white/10 p-3 flex items-center gap-4 z-50 backdrop-blur-md bg-opacity-80">
    <button id="gp-play" class="w-10 h-10 rounded-full bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center flex-shrink-0 transition-transform hover:scale-105"><i data-icon="play"></i></button>
    <div class="flex-grow">
      <div class="text-white font-bold text-sm" id="gp-title">Podcast</div>
      <div class="w-full h-2 bg-slate-800 rounded-full mt-1 overflow-hidden cursor-pointer" id="gp-progress-container">
        <div id="gp-progress" class="h-full bg-emerald-500 pointer-events-none" style="width: 0%"></div>
      </div>
    </div>
    <audio id="gp-audio" class="hidden"></audio>
    <button id="gp-close" class="text-slate-400 hover:text-white flex-shrink-0"><i data-icon="x"></i></button>
  </div>

  <div id="lock-toast" class="hidden" role="status" aria-live="polite"></div>

  <div id="leaderboard-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm" role="dialog" aria-modal="true">
    <!-- content injected via JS -->
  </div>

  <!-- Pixel Art Modal -->
  <div id="pixel-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md" role="dialog" aria-modal="true">
    <div class="bg-slate-900 border border-indigo-500/50 rounded-2xl p-4 w-full max-w-2xl flex flex-col items-center">
      <div class="flex justify-between w-full mb-4">
        <h2 class="text-xl font-bold text-white">Community Leinwand</h2>
        <button id="pixel-close" class="text-slate-400 hover:text-white"><i data-icon="x"></i></button>
      </div>
      <p class="text-slate-300 text-sm mb-4 text-center">Jedes geöffnete Türchen gibt dir 10 Pixel. Male gemeinsam mit allen anderen an diesem Bild!</p>
      <div class="flex items-center gap-4 mb-4">
        <div class="flex gap-2 bg-black/50 p-2 rounded-lg">
          <button class="w-8 h-8 rounded-full bg-white pixel-color-btn border-2 border-transparent" data-color="#ffffff"></button>
          <button class="w-8 h-8 rounded-full bg-black pixel-color-btn border-2 border-transparent" data-color="#000000"></button>
          <button class="w-8 h-8 rounded-full bg-rose-500 pixel-color-btn border-2 border-transparent" data-color="#f43f5e"></button>
          <button class="w-8 h-8 rounded-full bg-emerald-500 pixel-color-btn border-2 border-transparent" data-color="#10b981"></button>
          <button class="w-8 h-8 rounded-full bg-amber-400 pixel-color-btn border-2 border-transparent" data-color="#fbbf24"></button>
          <button class="w-8 h-8 rounded-full bg-blue-500 pixel-color-btn border-2 border-transparent" data-color="#3b82f6"></button>
        </div>
        <div class="text-indigo-300 font-bold bg-indigo-900/30 px-4 py-2 rounded-lg"><span id="pixel-count">0</span> Pixel übrig</div>
      </div>
      <div class="overflow-auto border border-white/10 rounded-lg bg-black" style="max-height: 60vh;">
        <canvas id="pixel-canvas" width="500" height="500" class="block cursor-crosshair" style="image-rendering: pixelated; width: 500px; height: 500px;"></canvas>
      </div>
    </div>
  </div>

  <div id="content-modal" class="hidden" role="dialog" aria-modal="true">
    <div id="modal-card">
      <button id="modal-close" aria-label="Schließen"><i data-icon="x"></i></button>
      <div id="modal-body"></div>
      <div id="modal-feedback" class="hidden border-t border-white/10 mt-6 pt-4 flex items-center justify-between">
        <div class="flex gap-2">
          <button class="feedback-emoji text-2xl hover:scale-125 transition-transform text-rose-400" data-reaction="heart" title="Liebe"><i data-icon="heart"></i></button>
          <button class="feedback-emoji text-2xl hover:scale-125 transition-transform text-amber-300" data-reaction="laugh" title="Lustig"><i data-icon="laugh"></i></button>
          <button class="feedback-emoji text-2xl hover:scale-125 transition-transform text-sky-300" data-reaction="touched" title="Gerührt"><i data-icon="frown"></i></button>
          <button class="feedback-emoji text-2xl hover:scale-125 transition-transform text-emerald-300" data-reaction="party" title="Feiern"><i data-icon="party-popper"></i></button>
        </div>
        <button id="feedback-voice" class="rounded-full bg-rose-600/20 text-rose-500 hover:bg-rose-600/30 p-2 transition-colors flex items-center gap-2 text-sm font-semibold">
          <i data-icon="mic"></i> Antworten
        </button>
      </div>
    </div>
  </div>

  <style>.hidden { display: none !important; }</style>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <script src="/calendar/js/atmosphere.js"></script>
  <script src="/calendar/js/themes.js"></script>
  <script src="/calendar/js/art.js"></script>
  <script src="/calendar/js/particles.js"></script>
  <script src="/calendar/js/scenes.js"></script>
  <script src="/shared/app-links.js"></script>
  <script src="/shared/welcome.js"></script>
  <script src="/calendar/js/calendar.js"></script>
  <script src="/shared/native.js"></script>
</body>
</html>

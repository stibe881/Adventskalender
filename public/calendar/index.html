<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dein Adventskalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/calendar/themes.css" />
</head>
<body>
  <div id="scene" aria-hidden="true"></div>
  <canvas id="particle-canvas" aria-hidden="true"></canvas>

  <div id="app-root">
    <div id="preview-banner" class="hidden">👁 Admin-Vorschau – Zeitsperre ist deaktiviert</div>

    <header id="calendar-header" class="hero"></header>

    <main id="calendar-frame">
      <div id="garland"></div>
      <div id="door-grid" class="door-grid" role="list"></div>
    </main>

    <p id="calendar-footer" class="calendar-footer"></p>
  </div>

  <div id="lock-toast" class="hidden" role="status" aria-live="polite"></div>

  <div id="content-modal" class="hidden" role="dialog" aria-modal="true">
    <div id="modal-card">
      <button id="modal-close" aria-label="Schließen">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <style>.hidden { display: none !important; }</style>

  <script src="/vendor/gsap/gsap.min.js"></script>
  <script src="/calendar/js/themes.js"></script>
  <script src="/calendar/js/scenes.js"></script>
  <script src="/calendar/js/particles.js"></script>
  <script src="/calendar/js/calendar.js"></script>
</body>
</html>

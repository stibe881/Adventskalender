<!DOCTYPE html>
<html>
<head>
  <style>
    body { background: #333; color: white; display: flex; gap: 20px; }
    svg { width: 400px; height: 400px; border: 1px solid red; overflow: visible; background: #222; }
    .shop { display: flex; flex-wrap: wrap; gap: 10px; width: 200px; }
    .tile { width: 64px; height: 64px; background: #444; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .tile svg { width: 100%; height: 100%; border: none; background: transparent; }
  </style>
</head>
<body>
  <div id="main"></div>
  <div id="shop" class="shop"></div>
  <script src="./public/calendar/js/rudi.js"></script>
  <script>
    document.getElementById('main').innerHTML = window.RudiArt.rudi({
      worn: ['bow', 'bell', 'hat', 'crown', 'glasses', 'skis', 'lights', 'sleigh', 'wings', 'star', 'santahat'],
      state: 'happy'
    });
    let shopHtml = '';
    for (let id in window.RudiArt.GEAR) {
      shopHtml += '<div class="tile">' + window.RudiArt.gear(id) + '</div>';
    }
    document.getElementById('shop').innerHTML = shopHtml;
  </script>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adventskalender & Wichteln</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0b1120; color: #e2e8f0; font-family: -apple-system, Inter, Roboto, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; box-sizing: border-box; }
    .icon { font-size: 64px; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p { color: #94a3b8; font-size: 15px; line-height: 1.5; max-width: 320px; }
    button { margin-top: 20px; background: #059669; color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 16px; font-weight: 600; }
  </style>
</head>
<body>
  <!-- Shown only when the app cannot reach the server (offline) or while server.url is not configured. -->
  <main>
    <div class="icon">🎄</div>
    <h1>Adventskalender &amp; Wichteln</h1>
    <p id="msg">Keine Verbindung zum Server. Bitte prüfe deine Internetverbindung und versuche es erneut.</p>
    <button onclick="location.reload()">Erneut versuchen</button>
  </main>
  <script>
    // If the app is opened with a bundled fallback (server.url missing), say so.
    if (location.protocol === "capacitor:" || location.hostname === "localhost") {
      document.getElementById("msg").textContent = "Die App ist noch nicht mit einem Server verbunden. Bitte in mobile/capacitor.config.json unter server.url die Adresse eintragen (npm run configure -- --url https://…).";
    }
  </script>
</body>
</html>
